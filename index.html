<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio II & Programación II | Lic. en Informática y Desarrollo de Software - UDA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-code: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      
      /* Light Theme (Default: Clean Educational) */
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-hover: #e2e8f0;
      --border-color: #e2e8f0;
      --border-subtle: #f1f5f9;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-inverse: #ffffff;
      
      --brand-primary: #4f46e5;
      --brand-primary-light: #eef2ff;
      --brand-uda: #800020; /* Borgoña institucional UDA */
      --brand-uda-light: #fdf2f4;
      
      --accent-cpp: #0284c7;
      --accent-cpp-light: #f0f9ff;
      --accent-java: #ea580c;
      --accent-java-light: #fff7ed;
      
      --accent-success: #10b981;
      --accent-success-light: #ecfdf5;
      --accent-warning: #f59e0b;
      --accent-warning-light: #fffbeb;
      --accent-danger: #ef4444;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.03);
      
      --sidebar-w: 320px;
    }

    .dark {
      --bg-body: #0b0f19;
      --bg-surface: #131b2e;
      --bg-subtle: #1c263d;
      --bg-hover: #263352;
      --border-color: #28354f;
      --border-subtle: #1c263d;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-inverse: #0f172a;
      
      --brand-primary: #6366f1;
      --brand-primary-light: #1e1b4b;
      --brand-uda: #e11d48;
      --brand-uda-light: #31131c;
      
      --accent-cpp: #38bdf8;
      --accent-cpp-light: #082f49;
      --accent-java: #fb923c;
      --accent-java-light: #371b07;
      
      --accent-success: #34d399;
      --accent-success-light: #064e3b;
      --accent-warning: #fbbf24;
      --accent-warning-light: #451a03;
      --accent-danger: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-main);
      background-color: var(--bg-body);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Layout */
    #sidebar {
      width: var(--sidebar-w);
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: margin-left 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 40;
      overflow: hidden;
    }

    #sidebar.collapsed {
      margin-left: calc(-1 * var(--sidebar-w));
    }

    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: var(--bg-body);
      position: relative;
      min-width: 0;
    }

    /* Header */
    header {
      height: 72px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 0 14px;
      background-color: var(--bg-surface);
      flex-shrink: 0;
      gap: 12px;
      z-index: 30;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      min-width: 0;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--brand-uda), #4a0012);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .brand-titles h1 {
      font-size: 0.95rem;
      font-weight: 800;
      line-height: 1.25;
      color: var(--text-main);
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
      padding: 0;
    }

    .brand-titles p {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
      margin-top: 1px;
    }

    /* Nav Tabs */
    .nav-tabs {
      display: flex;
      align-items: center;
      background-color: var(--bg-subtle);
      padding: 3px;
      border-radius: 10px;
      gap: 3px;
      flex-shrink: 1;
      overflow-x: auto;
    }

    .nav-tab-btn {
      padding: 6px 12px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .nav-tab-btn:hover {
      color: var(--text-main);
      background-color: var(--bg-hover);
    }

    .nav-tab-btn.active {
      background-color: var(--bg-surface);
      color: var(--brand-primary);
      box-shadow: var(--shadow-sm);
    }

    .nav-tab-btn.special-cero {
      color: var(--accent-success);
    }
        .nav-tab-btn.special-antigravity {
      color: #9333ea;
    }
    .nav-tab-btn.special-antigravity:hover {
      background-color: rgba(147, 51, 234, 0.08);
      color: #7e22ce;
    }
    .nav-tab-btn.special-antigravity.active {
      background-color: #f3e8ff;
      color: #7e22ce;
      font-weight: 800;
    }
    .dark .nav-tab-btn.special-antigravity {
      color: #c084fc;
    }
    .dark .nav-tab-btn.special-antigravity:hover {
      background-color: rgba(192, 132, 252, 0.12);
    }
    .dark .nav-tab-btn.special-antigravity.active {
      background-color: #3b0764;
      color: #e9d5ff;
    }

    .nav-tab-btn.special-cero.active {
      background-color: var(--accent-success-light);
      color: var(--accent-success);
    }

    /* Header Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .tp-badge-counter {
      background-color: var(--brand-primary-light);
      color: var(--brand-primary);
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background-color: var(--bg-subtle);
    }

    .sidebar-collapse-btn {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-subtle);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .sidebar-collapse-btn:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    /* Floating toggle when sidebar is collapsed */
    .floating-expand-btn {
      position: absolute;
      bottom: 24px;
      left: 20px;
      background: var(--brand-primary);
      color: white;
      border: none;
      padding: 9px 15px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: var(--shadow-lg);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 35;
      transition: all 0.15s ease;
    }
    .floating-expand-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-xl);
    }

    /* Sidebar Content */
    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .sidebar-search {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-subtle);
      color: var(--text-main);
      font-size: 0.85rem;
      margin-top: 10px;
      outline: none;
      transition: border 0.15s;
    }
    .sidebar-search:focus {
      border-color: var(--brand-primary);
      background-color: var(--bg-surface);
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .unit-nav-card {
      padding: 12px 14px;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.15s;
      border: 1px solid transparent;
    }

    .unit-nav-card:hover {
      background-color: var(--bg-subtle);
    }

    .unit-nav-card.active {
      background-color: var(--brand-primary-light);
      border-color: var(--brand-primary);
    }

    .unit-nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .unit-nav-num {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--brand-primary);
      text-transform: uppercase;
    }

    .unit-nav-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    .unit-nav-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
    }

    /* Content Body & Views */
    .content-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .content-container {
      max-width: 1060px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Educational Card */
    .edu-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    /* Video Theater */
    .video-theater {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .video-toolbar {
      padding: 12px 18px;
      background-color: var(--bg-subtle);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .video-switch-group {
      display: flex;
      background-color: var(--bg-surface);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      gap: 4px;
    }

    .video-switch-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      background: transparent;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .video-switch-btn.active.cpp {
      background-color: var(--accent-cpp);
      color: white;
    }
    .video-switch-btn.active.java {
      background-color: var(--accent-java);
      color: white;
    }

    .video-notice-bar {
      padding: 10px 18px;
      background: var(--bg-hover);
      font-size: 0.82rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .video-frame-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background-color: #000000;
    }

    .video-frame-wrapper iframe,
    .video-frame-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-meta-bar {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .video-instructor-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .instructor-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981, #047857);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
    }

    /* Video Playlist Drawer / List inside Theater */
    .video-playlist-container {
      background-color: var(--bg-surface);
      padding: 16px 20px;
    }

    .video-playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .video-nav-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .video-playlist-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .video-playlist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .video-playlist-item:hover {
      background-color: var(--bg-hover);
      border-color: var(--brand-primary);
    }

    .video-playlist-item.active {
      background-color: var(--brand-primary-light);
      border-color: var(--brand-primary);
    }

    .video-item-index {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-muted);
      flex-shrink: 0;
      border: 1px solid var(--border-color);
    }

    .video-playlist-item.active .video-item-index {
      background: var(--brand-primary);
      color: white;
      border-color: var(--brand-primary);
    }

    .video-item-info {
      flex: 1;
      min-width: 0;
    }

    .video-item-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-item-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .video-item-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--brand-primary);
      flex-shrink: 0;
    }

    /* Lesson Sub Tabs */
    .lesson-tabs-nav {
      display: flex;
      border-bottom: 2px solid var(--border-color);
      gap: 16px;
      margin-top: 8px;
      overflow-x: auto;
    }

    .lesson-tab-link {
      padding: 10px 4px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      transition: color 0.15s;
    }

    .lesson-tab-link:hover {
      color: var(--text-main);
    }

    .lesson-tab-link.active {
      color: var(--brand-primary);
    }

    .lesson-tab-link.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--brand-primary);
      border-radius: 2px;
    }

    /* Code Box */
    .code-box {
      background-color: #0d1117;
      color: #c9d1d9;
      border-radius: 10px;
      overflow: hidden;
      margin: 14px 0;
      font-family: var(--font-code);
      border: 1px solid #30363d;
    }

    .code-box-header {
      background-color: #161b22;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: #8b949e;
      border-bottom: 1px solid #30363d;
    }

    .code-box pre {
      padding: 16px;
      overflow-x: auto;
      font-size: 0.85rem;
      line-height: 1.55;
    }

    /* Badges & Buttons */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-primary { background: var(--brand-primary-light); color: var(--brand-primary); }
    .badge-uda { background: var(--brand-uda-light); color: var(--brand-uda); }
    .badge-cpp { background: var(--accent-cpp-light); color: var(--accent-cpp); }
    .badge-java { background: var(--accent-java-light); color: var(--accent-java); }
    .badge-success { background: var(--accent-success-light); color: var(--accent-success); }
    .badge-warning { background: var(--accent-warning-light); color: var(--accent-warning); }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      transition: all 0.15s;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--brand-primary);
      color: white;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.92; transform: translateY(-1px); }

    .btn-secondary {
      background-color: var(--bg-subtle);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover:not(:disabled) { background-color: var(--bg-hover); }

    .btn-success {
      background-color: var(--accent-success);
      color: white;
    }
    .btn-success:hover:not(:disabled) { opacity: 0.92; }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }
    .btn-outline:hover:not(:disabled) { background-color: var(--bg-subtle); }

    .btn-youtube {
      background: #cc0000;
      color: white;
      text-decoration: none;
    }
    .btn-youtube:hover:not(:disabled) {
      background: #b00000;
      color: white;
    }

    /* Accordion / QA */
    .qa-item {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .qa-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
    }

    .qa-body {
      padding: 14px 16px;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      font-size: 0.86rem;
      line-height: 1.6;
      color: var(--text-muted);
      display: none;
    }
    .qa-body.show { display: block; }

    /* TP Check List */
    .tp-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 15px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      border-radius: 10px;
      margin-bottom: 10px;
      gap: 12px;
    }

    .tp-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    /* Responsive */
    @media (max-width: 1100px) {
      .nav-tab-btn span { display: none; }
      .brand-titles p { display: none; }
    }

    @media (max-width: 850px) {
      #sidebar {
        position: absolute;
        top: 72px;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
      }
      #sidebar.open {

      "summaryPoints": [
        "<strong>¿Qué es un Puntero?:</strong> Una variable que almacena la <em>dirección física de memoria RAM</em> de otra variable (un número hexadecimal como <code>0x7ffee4</code>).",
        "<strong>Operador & (Dirección):</strong> Extrae la posición de memoria de una variable (ej: <code>p = &x;</code>).",
        "<strong>Operador * (Indirección / Desreferencia):</strong> Viaja a la dirección guardada y lee o modifica el valor real alojado allí (ej: <code>*p = 50;</code>).",
        "<strong>Memoria Dinámica en C++:</strong> <code>new</code> solicita memoria al Heap en tiempo de ejecución. <code>delete</code> (o <code>delete[]</code> para arreglos) es <strong>obligatorio</strong> para devolver la memoria a Windows y prevenir fugas (Memory Leaks)."
      ],
      "examQuestions": [
        {
          "q": "Si ejecutas `int* p = new int[100];` y luego haces `p = nullptr;` sin llamar a `delete[]`, ¿qué problema ocurre?",
          "a": "Ocurre una fuga de memoria (Memory Leak). Los 400 bytes reservados en el Heap quedan asignados pero inaccesibles, ya que perdimos la única dirección de memoria que apuntaba a ellos."
        },
        {
          "q": "¿Cuál es la relación entre el nombre de un arreglo y un puntero en C++?",
          "a": "El identificador de un arreglo actúa como un puntero constante al primer elemento. Por lo tanto, `arr[i]` es computacionalmente equivalente a `*(arr + i)` mediante aritmética de punteros."
        }

      "tpContent": {
        "id": "tp5",
        "name": "Trabajo Práctico 5: Ejercicios de Punteros en C++",
        "consigna": "Desarrollar un programa en C++ que solicite al usuario la cantidad de notas de alumnos (N), reserve memoria dinámica con 'new', cargue las notas usando aritmética de punteros, determine la nota mayor y menor, y libere la memoria con 'delete[]'.",
        "codeCpp": "#include <iostream>\n\nint main() {\n    int n;\n    std::cout << \"=== TP 5: Punteros y Memoria Dinamica ===\\n\";\n    std::cout << \"¿Cuantas notas desea ingresar?: \";\n    std::cin >> n;\n\n    if (n <= 0) {\n        std::cout << \"Cantidad invalida.\\n\";\n        return 1;\n    }\n\n    // 1. Reserva dinamica de memoria en Heap\n    double* notas = new double[n];\n\n    // 2. Carga usando aritmetica de punteros\n    for (int i = 0; i < n; i++) {\n        std::cout << \"Ingrese la nota [\" << (i + 1) << \"]: \";\n        std::cin >> *(notas + i); // Equivalente a notas[i]\n    }\n\n    // 3. Calculo de mayor y menor\n    double mayor = *notas;\n    double menor = *notas;\n    double suma = 0;\n\n    for (int i = 0; i < n; i++) {\n        double val = *(notas + i);\n        if (val > mayor) mayor = val;\n        if (val < menor) menor = val;\n        suma += val;\n    }\n\n    std::cout << \"\\n--- RESULTADOS ---\\n\";\n    std::cout << \"Nota Mayor: \" << mayor << \"\\n\";\n    std::cout << \"Nota Menor: \" << menor << \"\\n\";\n    std::cout << \"Promedio: \" << (suma / n) << \"\\n\";\n\n    // 4. Liberacion obligatoria de memoria\n    delete[] notas;\n    notas = nullptr; // Buena practica: neutralizar puntero\n    std::cout << \"Memoria liberada exitosamente.\\n\";\n\n    return 0;\n}",
        "codeJava": "// En Java no existe 'new primitivo[]' que requiera delete manual,\n// la JVM se encarga de la recoleccion de basura:\nimport java.util.Scanner;\n\npublic class TP5_JavaEquivalente {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Cantidad de notas: \");\n        int n = sc.nextInt();\n        double[] notas = new double[n]; // Heap dinamico gestionado por GC\n        \n        for (int i = 0; i < n; i++) {\n            System.out.print(\"Nota \" + (i + 1) + \": \");\n            notas[i] = sc.nextDouble();\n        }\n        System.out.println(\"Procesadas \" + n + \" notas sin fugas de memoria.\");\n        sc.close();\n    }\n}"

    function loadState() {
      try {
        const stored = localStorage.getItem("uda_lab2_student_state");
        if (stored) {
          appState = Object.assign({}, DEFAULT_APP_STATE, JSON.parse(stored));
        } else {
          appState = JSON.parse(JSON.stringify(DEFAULT_APP_STATE));
        }
      } catch (e) {
        appState = JSON.parse(JSON.stringify(DEFAULT_APP_STATE));
      }
      if (!appState.activeVideoIndex) appState.activeVideoIndex = {};
      if (!appState.watchedVideos) appState.watchedVideos = {};
      const isLocalHost = (typeof window !== 'undefined' && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'));
      if (!isLocalHost) {
        if (!appState.playerEngine || appState.playerEngine === "native") {
          appState.playerEngine = "cinema";
        }
      } else if (!appState.playerEngine) {
        appState.playerEngine = "native";
      }
      if (!appState.activeEjercicioId) appState.activeEjercicioId = "ej-1";
      applyTheme();
      applySidebarState();
      updateHeaderBadges();
    }

    function saveState() {
      try {
        localStorage.setItem("uda_lab2_student_state", JSON.stringify(appState));
      } catch (e) {}
      updateHeaderBadges();
    }

    function toggleTheme() {
      appState.theme = appState.theme === "dark" ? "light" : "dark";
      saveState();
      applyTheme();
    }

    function applyTheme() {
      const htmlEl = document.documentElement;
      if (appState.theme === "dark") {
        htmlEl.classList.add("dark");
        htmlEl.classList.remove("light");
      } else {
        htmlEl.classList.add("light");
        htmlEl.classList.remove("dark");
      }
    }

    function toggleSidebar() {
      const sb = document.getElementById("sidebar");
      if (!sb) return;

      // On mobile
      if (window.innerWidth <= 850) {
        sb.classList.toggle("open");
        return;
      }

      // On desktop: collapse/expand
      appState.sidebarCollapsed = !appState.sidebarCollapsed;
      saveState();
      applySidebarState();
    }

    function applySidebarState() {
      const sb = document.getElementById("sidebar");
      const floatBtn = document.getElementById("floatingOpenSidebarBtn");
      if (!sb) return;

      if (window.innerWidth > 850 && appState.sidebarCollapsed) {
        sb.classList.add("collapsed");
        if (floatBtn) floatBtn.style.display = "flex";
      } else {
        sb.classList.remove("collapsed");
        if (floatBtn) floatBtn.style.display = "none";
      }
    }

      const completedCount = Object.keys(appState.completedTps || {}).filter(k => appState.completedTps[k]).length;

      if (sbPct) sbPct.innerText = pct + "%";

                    <span style="display:inline-block; margin-top:6px; font-size:0.76rem; background:rgba(255,255,255,0.08); padding:3px 10px; border-radius:12px; color:#cbd5e1;">

            <!-- Video Metadata Bar -->

              <div class="video-instructor-badge">
                <div class="instructor-avatar">${lang === 'cpp' ? 'AT' : 'JA'}</div>

                </div>
              </div>
              <div class="video-nav-controls">
                <button class="btn btn-outline" style="padding:6px 12px; font-size:0.8rem;" onclick="prevLessonVideo('${u.id}', '${lang}')" ${currentIdx === 0 ? 'disabled' : ''}>
                  ⏮️ Anterior
                </button>
                <span style="font-size:0.82rem; font-weight:700; color:var(--text-muted);">${currentIdx + 1} / ${videoList.length}</span>
                <button class="btn btn-outline" style="padding:6px 12px; font-size:0.8rem;" onclick="nextLessonVideo('${u.id}', '${lang}')" ${currentIdx === videoList.length - 1 ? 'disabled' : ''}>
                  Siguiente ⏭️
                </button>
              </div>
            </div>

            <!-- INTERACTIVE PLAYLIST FOR THIS UNIT -->
            <div class="video-playlist-container">
              <div class="video-playlist-header">
                <div>
                  <strong style="font-size:0.92rem;">📺 Temario Completo de Videos de esta Unidad (${videoList.length} Clases Disponibles):</strong>
                  <span style="font-size:0.8rem; color:var(--text-muted); margin-left:8px;">Has completado ${watchedCount} de ${videoList.length}</span>

                  Haz clic en cualquier clase para reproducirla
                </div>
              </div>

              <div class="video-playlist-list">
                ${videoList.map((v, i) => {
                  const isActive = (i === currentIdx);
                  const isDone = appState.watchedVideos && appState.watchedVideos[v.id];
                  return `
                    <div class="video-playlist-item ${isActive ? 'active' : ''}" onclick="selectLessonVideo('${u.id}', '${lang}', ${i})">
                      <div class="video-item-index">${i + 1}</div>
                      <div class="video-item-info">
                        <div class="video-item-title">${escapeHtml(v.title)}</div>
                        <div class="video-item-sub">${escapeHtml(v.topics)} • ${escapeHtml(v.channel)}</div>
                      </div>
                      <div class="video-item-badge">

          <!-- LESSON CONTENT TABS -->

            </button>

              🎯 ${u.tpContent.name}
            </button>

              💻 Código para VS Code
            </button>

              ⚠️ Preguntas de Parcial & Final
            </button>

    function togglePlayerEngine() {
      const isLocalHost = (typeof window !== 'undefined' && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'));
      if (isLocalHost) {
        appState.playerEngine = (appState.playerEngine === "native") ? "iframe" : "native";
      } else {
        appState.playerEngine = (appState.playerEngine === "cinema") ? "iframe" : "cinema";
      }
      saveState();
      renderCurrentView();
    }

    function onNativeVideoError(videoId, embedUrl) {
      console.warn("Native stream error or offline file:// protocol, offering fallback.");
      const isLocalHost = (typeof window !== 'undefined' && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'));
      appState.playerEngine = isLocalHost ? "iframe" : "cinema";
      saveState();
      renderCurrentView();
    }

    function selectLessonVideo(unitId, lang, idx) {
      if (!appState.activeVideoIndex) appState.activeVideoIndex = {};
      appState.activeVideoIndex[unitId + '_' + lang] = idx;
      saveState();
      renderCurrentView();
    }

    function prevLessonVideo(unitId, lang) {
      const u = UDA_DATA.units.find(item => item.id === unitId) || UDA_DATA.units[0];
      const videoList = (lang === "cpp") ? (u.videosCpp || [u.videoCpp]) : (u.videosJava || [u.videoJava]);
      const key = unitId + '_' + lang;
      const currentIdx = (appState.activeVideoIndex && appState.activeVideoIndex[key] !== undefined) ? appState.activeVideoIndex[key] : 0;
      if (currentIdx > 0) {
        selectLessonVideo(unitId, lang, currentIdx - 1);
      }
    }

    function nextLessonVideo(unitId, lang) {
      const u = UDA_DATA.units.find(item => item.id === unitId) || UDA_DATA.units[0];
      const videoList = (lang === "cpp") ? (u.videosCpp || [u.videoCpp]) : (u.videosJava || [u.videoJava]);
      const key = unitId + '_' + lang;
      const currentIdx = (appState.activeVideoIndex && appState.activeVideoIndex[key] !== undefined) ? appState.activeVideoIndex[key] : 0;
      if (currentIdx < videoList.length - 1) {
        selectLessonVideo(unitId, lang, currentIdx + 1);
      }
    }

    function toggleCurrentVideoWatched(videoId) {
      if (!appState.watchedVideos) appState.watchedVideos = {};
      appState.watchedVideos[videoId] = !appState.watchedVideos[videoId];
      saveState();
      renderSidebar();
      renderCurrentView();
    }

      if (tab === "tp") {
        const tp = u.tpContent;
        const tpDone = u.tps.every(t => appState.completedTps[t]);

          <div class="edu-card">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-bottom:16px;">

                <span class="badge badge-uda">Cátedra UDA</span>
                <span class="badge badge-primary" style="margin-left:6px;">${u.tps.join(' & ')}</span>

              </div>
              <button class="btn ${tpDone ? 'btn-success' : 'btn-primary'}" onclick="toggleUnitTps('${u.id}')">
                ${tpDone ? '✅ TPs Marcados como Realizados' : '✓ Marcar estos TPs como Completados'}

                  <div class="code-box-header">
                    <span>tp_${u.id}.cpp</span>
                    <button class="btn btn-outline" style="padding:4px 8px; font-size:0.75rem;" onclick="copyCodeText(this)">Copiar</button>

                  <pre><code>${escapeHtml(tp.codeCpp)}</code></pre>
                </div>
              </div>
              <div>
                <div style="font-weight:700; color:var(--accent-java); font-size:0.85rem; margin-bottom:6px;">Versión Java:</div>
                <div class="code-box" style="margin:0;">
                  <div class="code-box-header">
                    <span>tp_${u.id}.java</span>
                    <button class="btn btn-outline" style="padding:4px 8px; font-size:0.75rem;" onclick="copyCodeText(this)">Copiar</button>

                  <pre><code>${escapeHtml(tp.codeJava)}</code></pre>
                </div>
              </div>
            </div>
          </div>

            </p>

            <div class="code-box">
              <div class="code-box-header">
                <span>Solucion_${u.id}_Completa.cpp</span>
                <button class="btn btn-outline" style="padding:4px 10px; font-size:0.75rem;" onclick="copyCodeText(this)">📋 Copiar Todo</button>
              </div>
              <pre><code>${escapeHtml(tp.codeCpp)}</code></pre>
            </div>
          </div>
        `;
      } else if (tab === "parcial") {
        return `
          <div class="edu-card">
            <h2 style="font-size:1.2rem; margin-bottom:8px;">⚠️ Preguntas Teóricas del Titular (Lic. Martín Vargas)</h2>
            <p style="font-size:0.88rem; color:var(--text-muted); margin-bottom:20px;">
              Estas son las preguntas conceptuales típicas que toma la cátedra en los parciales escritos y en las mesas de examen final oral:

            ${u.examQuestions.map((q, idx) => `
              <div class="qa-item">
                <div class="qa-header" onclick="toggleQa(this)">
                  <span>❓ ${q.q}</span>
                  <span style="font-size:0.8rem; color:var(--brand-primary);">👁️ Ver Respuesta</span>

    function switchVideoLang(lang) {
      appState.activeVideoLang = lang;
      saveState();
      renderSidebar();
      renderCurrentView();
    }

    function switchLessonTab(tab) {
      appState.activeLessonTab = tab;
      saveState();
      renderCurrentView();
    }

    function toggleUnitTps(unitId) {
      const u = UDA_DATA.units.find(item => item.id === unitId);
      if (!u) return;

      const allDone = u.tps.every(t => appState.completedTps[t]);
      u.tps.forEach(t => {
        appState.completedTps[t] = !allDone;
      });

      saveState();
      renderSidebar();
      renderCurrentView();
    }

    function toggleQa(headerEl) {
      const body = headerEl.nextElementSibling;
      if (body) {
        body.classList.toggle("show");
      }
    }

    // 6. VIEW: 10 TRABAJOS PRACTICOS OFICIALES

        <h3>Caso Práctico Resuelto: Dividir la Cuenta del Restaurante</h3>
        <p>
          <strong>Problema Real:</strong> <em>"Fuiste a cenar con 3 amigos (4 personas en total). La cuenta total de la comida fue de $12.000. Quieren dejar un 10% de propina al camarero y dividir el monto total en partes iguales. ¿Cuánto debe pagar cada persona?"</em>
        </p>

        <div style="background:var(--bg-tertiary); padding:16px; border-radius:10px; margin:16px 0;">
          <ol style="margin-left:18px; font-size:0.88rem; line-height:1.6;">

            <li><strong>2. Variables:</strong> <code>double cuenta = 12000.0;</code>, <code>double propinaPct = 0.10;</code>, <code>int personas = 4;</code></li>
            <li><strong>3. Proceso:</strong>
              <br>&bull; Calcular monto de propina: <code>cuenta * propinaPct</code> ($1200)
              <br>&bull; Calcular total con propina: <code>cuenta + propina</code> ($13200)
              <br>&bull; Dividir entre las personas: <code>totalConPropina / personas</code> ($3300)
            </li>
            <li><strong>4. Salida:</strong> Imprimir en pantalla: <code>"Cada persona debe pagar: $3300"</code></li>
          </ol>
        </div>

        <div class="dual-comparator" style="margin:20px 0;">

            <pre><code>public class CuentaCena {
    public static void main(String[] args) {
        // 1 & 2: Variables y datos de entrada
        double cuenta = 12000.0;
        double propina = cuenta * 0.10;
        int personas = 4;

        // 3: Proceso de cálculo
        double totalPagar = cuenta + propina;
        double porPersona = totalPagar / personas;

        // 4: Salida por pantalla
        System.out.println("Total con propina: $" + totalPagar);
        System.out.println("Cada amigo paga: $" + porPersona);
    }
}</code></pre>
          </div>
          <div class="dual-column">
            <div class="code-header" style="color:var(--accent-cpp);">⚡ Cómo se escribe en C++</div>
            <pre><code>#include &lt;iostream&gt;

int main() {
    // 1 & 2: Variables y datos de entrada
    double cuenta = 12000.0;
    double propina = cuenta * 0.10;
    int personas = 4;

    // 3: Proceso de cálculo
    double totalPagar = cuenta + propina;
    double porPersona = totalPagar / personas;

    // 4: Salida por pantalla
    std::cout << "Total con propina: $" << totalPagar << "\\n";
    std::cout << "Cada amigo paga: $" << porPersona << "\\n";
    return 0;
}</code></pre>

      <!-- ========================================== -->
      <section id="lec-05" class="card" style="margin-bottom:32px; scroll-margin-top:80px; ${currentBeginnerLesson === 'lec-05' ? 'border:2px solid var(--accent-success);' : ''}">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
          <span style="font-size:1.8rem;">🔄</span>
          <div>
            <span class="tag tag-success">Lección 5</span>
            <h2 style="margin:4px 0 0 0;">Cómo Automatizar Tareas Repetitivas (Los Bucles <code>for</code> y <code>while</code>)</h2>
          </div>
        </div>

        <p>
          A los seres humanos nos aburre hacer lo mismo muchas veces (imagina escribir a mano los números del 1 al 10.000). Nos cansaríamos, nos equivocaríamos y tardaríamos horas.<br>
          A las computadoras <strong>les encanta la repetición</strong>. Pueden hacer 100 millones de vueltas en un parpadeo sin cansarse ni cometer un solo error. A esa capacidad de repetir código la llamamos <strong>Bucles (Loops)</strong>.
        </p>

        <h3>1. El Bucle <code>for</code>: Cuando Sabes Cuántas Veces Repetir</h3>
        <p>Se compone de tres partes mágicas separadas por punto y coma:</p>
        <div class="code-container">
          <pre><code>for (int i = 1; i <= 5; i++) {
    System.out.println("Vuelta número: " + i);
}</code></pre>
        </div>
        <div style="background:var(--bg-tertiary); padding:14px; border-radius:8px; margin:14px 0; font-size:0.88rem;">
          <ol style="margin-left:18px; line-height:1.6;">
            <li><strong><code>int i = 1;</code> (El Inicio):</strong> Creamos una variable llamada <code>i</code> (abreviatura tradicional de <em>Índice</em> o contador) y la ponemos en 1. Esto se hace una sola vez.</li>
            <li><strong><code>i <= 5;</code> (La Condición de parada):</strong> Antes de dar cada vuelta, la computadora pregunta: <em>"¿Es 'i' menor o igual a 5?"</em>. Mientras sea verdad, da la vuelta. En cuanto sea 6, se frena.</li>
            <li><strong><code>i++</code> (El Paso):</strong> Al terminar cada vuelta, <code>i++</code> significa <em>"Súmale 1 al contador"</em>.</li>
          </ol>
        </div>

        <h3>2. El Bucle <code>while</code>: Repetir Mientras una Condición Sea Cierta</h3>
        <p>
          Usa <code>while</code> cuando no sabes cuántas veces exactas se va a repetir, sino que depende de algo externo.
          <br><em>Ejemplo cotidiano: La batería del teléfono celular.</em>
        </p>
        <div class="code-container">
          <pre><code>int bateria = 100;

while (bateria > 0) {
    System.out.println("El teléfono sigue encendido. Batería: " + bateria + "%");
    bateria = bateria - 25; // Se gasta batería
}

System.out.println("El teléfono se apagó.");</code></pre>
        </div>

        <div class="card card-highlight-warning" style="margin-top:16px; padding:14px;">
          <strong>⚠️ El Peligro del Bucle Infinito:</strong><br>
          Si en el ejemplo anterior hubieses olvidado la línea <code>bateria = bateria - 25;</code>, la batería siempre valdría 100 y la condición <code>bateria > 0</code> siempre sería verdadera. El programa se quedaría colgado para siempre. Si te pasa esto en la terminal, presiona <code>Ctrl + C</code> para forzar la detención.
        </div>

public class Ejercicio4_ParentesisBalanceados {
    public static boolean estaBalanceado(String expr) {
        Stack&lt;Character&gt; pila = new Stack&lt;&gt;();

        for (int i = 0; i &lt; expr.length(); i++) {
            char c = expr.charAt(i);

            // Aperturas van a la pila
            if (c == '(' || c == '[' || c == '{') {

                if (c == ']' &amp;&amp; tope != '[') return false;
                if (c == '}' &amp;&amp; tope != '{') return false;
            }
        }
        return pila.isEmpty(); // Debe quedar vacía
    }

    for (char c : expr) {

        if (c == '(' || c == '[' || c == '{') {
            pila.push(c);
        }
        // Cierres
        else if (c == ')' || c == ']' || c == '}') {

            if (c == ']' &amp;&amp; tope != '[') return false;
            if (c == '}' &amp;&amp; tope != '{') return false;
        }
    }
    return pila.empty();
}
